<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380">
<style>
.tw{animation:tw 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.tw2{animation:tw 2.4s ease-in-out .8s infinite;transform-box:fill-box;transform-origin:center}
.tw3{animation:tw 2.4s ease-in-out 1.6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}
.sway{animation:sway 5s ease-in-out infinite;transform-box:view-box;transform-origin:75px 312px}
@keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
.slosh{animation:slosh 4s ease-in-out infinite;transform-origin:75px 215px}
@keyframes slosh{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
.wave1{animation:wave 3.2s linear infinite}
.wave2{animation:wave 4.6s linear infinite reverse}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-75px)}}
.bub{animation:rise 5s ease-in infinite;opacity:0}
.b2{animation-duration:6.5s;animation-delay:1.2s}
.b3{animation-duration:4.2s;animation-delay:2.4s}
.b4{animation-duration:5.8s;animation-delay:3.3s}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.6}85%{opacity:.4}100%{transform:translateY(-150px);opacity:0}}
.ice{animation:bob 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.ice2{animation-delay:-1.2s;animation-duration:4.2s}
.ice3{animation-delay:-2.4s;animation-duration:3.9s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-7px) rotate(7deg)}}
.straw{animation:straw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes straw{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(3deg)}}
.heart{animation:beat 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.1)}60%{transform:scale(1)}}
.drip{animation:drip 4.5s ease-in infinite;opacity:0}
.drip2{animation-delay:2.2s;animation-duration:5.2s}
@keyframes drip{0%{transform:translateY(0);opacity:0}12%{opacity:.85}80%{opacity:.7}100%{transform:translateY(60px);opacity:0}}
.wob{animation:wob 4.5s ease-in-out infinite;transform-origin:0 0}
@keyframes wob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.ring{animation:spin 28s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  .tw,.tw2,.tw3,.sway,.slosh,.wave1,.wave2,.bub,.ice,.straw,.heart,.drip,.wob,.ring{animation:none}
  .bub,.drip{opacity:0}
}
</style>
<defs>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="2.2" fill="#EE9FB9" opacity=".35"/></pattern>
<linearGradient id="coffee" gradientUnits="userSpaceOnUse" x1="0" y1="118" x2="0" y2="312"><stop offset="0" stop-color="#D9B08C"/><stop offset=".45" stop-color="#A9744F"/><stop offset="1" stop-color="#7A5240"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#C2607F" flood-opacity=".22"/></filter>
<clipPath id="glass"><path d="M8,118 L142,118 L134,300 Q133,312 121,312 L29,312 Q17,312 16,300 Z"/></clipPath>
</defs>
<rect width="1000" height="380" rx="30" fill="#F9D3DF"/>
<rect width="1000" height="380" rx="30" fill="url(#dots)"/>

<!-- paper card -->
<g transform="rotate(-1.6 340 190)" filter="url(#sh)">
  <rect x="48" y="44" width="600" height="292" rx="10" fill="#FFF6EC"/>
  <rect x="60" y="30" width="96" height="30" fill="#C9A07A" opacity=".55" transform="rotate(-8 108 45)"/>
  <rect x="560" y="30" width="96" height="30" fill="#EE9FB9" opacity=".6" transform="rotate(8 608 45)"/>
  <text x="88" y="98" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="600" fill="#C2607F" letter-spacing=".5">@meribuilds ✳</text>
  <text x="84" y="172" font-family="Georgia, 'Playfair Display', 'DejaVu Serif', serif" font-size="68" font-weight="700" fill="#3B2620">hi, i'm meri</text>
  <text x="88" y="214" font-family="Georgia, 'Playfair Display', 'DejaVu Serif', serif" font-style="italic" font-size="25" fill="#7A5240">ai workflows without the complication.</text>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="600" fill="#3B2620">
    <rect x="88" y="248" width="170" height="36" rx="18" fill="#F9D3DF"/><text x="173" y="271" text-anchor="middle">claude specialist</text>
    <rect x="270" y="248" width="130" height="36" rx="18" fill="#F9D3DF"/><text x="335" y="271" text-anchor="middle">ai educator</text>
    <rect x="412" y="248" width="170" height="36" rx="18" fill="#F9D3DF"/><text x="497" y="271" text-anchor="middle">between cities ✦</text>
  </g>
</g>

<!-- iced coffee -->
<g transform="translate(760 40)">
 <g class="sway">
  <g transform="rotate(12 64 52)"><rect class="straw" x="58" y="-8" width="12" height="120" rx="6" fill="#EE9FB9"/></g>
  <path d="M0,70 L150,70 L134,300 Q133,312 121,312 L29,312 Q17,312 16,300 Z" fill="#FFFFFF" opacity=".55"/>

  <!-- moving liquid -->
  <g clip-path="url(#glass)">
    <g class="slosh">
      <g class="wave1"><path fill="#FFF6EC" d="M-150,118 Q-131.25,108 -112.5,118 T-75,118 T-37.5,118 T0,118 T37.5,118 T75,118 T112.5,118 T150,118 T187.5,118 T225,118 T262.5,118 V330 H-150 Z"/></g>
      <g class="wave2"><path fill="url(#coffee)" d="M-150,140 Q-131.25,130 -112.5,140 T-75,140 T-37.5,140 T0,140 T37.5,140 T75,140 T112.5,140 T150,140 T187.5,140 T225,140 T262.5,140 V330 H-150 Z"/></g>
      <circle class="bub" cx="40" cy="296" r="3" fill="#fff"/>
      <circle class="bub b2" cx="72" cy="300" r="2.2" fill="#fff"/>
      <circle class="bub b3" cx="104" cy="298" r="3.2" fill="#fff"/>
      <circle class="bub b4" cx="56" cy="304" r="1.8" fill="#fff"/>
    </g>
  </g>

  <!-- ice cubes -->
  <g transform="rotate(-12 48 177)"><rect class="ice" x="30" y="160" width="36" height="34" rx="7" fill="#fff" opacity=".4"/></g>
  <g transform="rotate(14 97 206)"><rect class="ice ice2" x="80" y="190" width="34" height="32" rx="7" fill="#fff" opacity=".35"/></g>
  <g transform="rotate(6 60 247)"><rect class="ice ice3" x="44" y="232" width="32" height="30" rx="7" fill="#fff" opacity=".3"/></g>

  <rect x="-6" y="62" width="162" height="14" rx="7" fill="#FFFFFF" opacity=".8"/>
  <path class="heart" d="M75,262 c-10,-10 -24,-2 -16,10 l16,14 l16,-14 c8,-12 -6,-20 -16,-10z" fill="#EE9FB9"/>

  <!-- condensation drips -->
  <path class="drip" d="M11,150 q-3,5 0,7 q3,-2 0,-7z" fill="#fff"/>
  <path class="drip drip2" d="M140,176 q-3,5 0,7 q3,-2 0,-7z" fill="#fff"/>
 </g>
</g>

<!-- sticker -->
<g transform="translate(700 296) rotate(-10)">
 <g class="wob">
  <circle r="56" fill="#3B2620"/><circle class="ring" r="49" fill="none" stroke="#F9D3DF" stroke-width="1.5" stroke-dasharray="3 4"/>
  <text y="-2" text-anchor="middle" font-family="Georgia, 'Playfair Display', 'DejaVu Serif', serif" font-size="24" font-weight="700" fill="#F9D3DF">17 yrs</text>
  <text y="18" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="10" font-weight="600" fill="#FFF6EC">in the VA world</text>
 </g>
</g>

<path class="tw" transform="translate(722 74) scale(1.5)" d="M0,-10 C1.5,-2 2,-1.5 10,0 C2,1.5 1.5,2 0,10 C-1.5,2 -2,1.5 -10,0 C-2,-1.5 -1.5,-2 0,-10Z" fill="#C2607F"/>
<path class="tw2" transform="translate(950 120) scale(1.1)" d="M0,-10 C1.5,-2 2,-1.5 10,0 C2,1.5 1.5,2 0,10 C-1.5,2 -2,1.5 -10,0 C-2,-1.5 -1.5,-2 0,-10Z" fill="#fff"/>
<path class="tw3" transform="translate(940 330) scale(1.3)" d="M0,-10 C1.5,-2 2,-1.5 10,0 C2,1.5 1.5,2 0,10 C-1.5,2 -2,1.5 -10,0 C-2,-1.5 -1.5,-2 0,-10Z" fill="#C2607F"/>
<path class="tw2" transform="translate(690 196) scale(0.9)" d="M0,-10 C1.5,-2 2,-1.5 10,0 C2,1.5 1.5,2 0,10 C-1.5,2 -2,1.5 -10,0 C-2,-1.5 -1.5,-2 0,-10Z" fill="#fff"/>
</svg>
